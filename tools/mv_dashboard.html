<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>恋色空 MV · 全片渲染进度</title>
<style>
  :root{
    --bg:#0b1018; --panel:#111925; --panel2:#0d1520; --line:#253347; --line2:#344761;
    --text:#eef2f7; --sub:#9fb0c4; --mute:#64788f; --amber:#e8a15b; --rose:#bd5570;
    --ice:#a9c7da; --good:#83c7a4; --warn:#e6bb68; --bad:#dd6b6b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--text); background:var(--bg);
    font:14px/1.55 "Microsoft YaHei","Noto Sans SC","Yu Gothic UI",system-ui,sans-serif;
    background-image:
      radial-gradient(circle at 85% -10%, rgba(189,85,112,.14), transparent 32rem),
      radial-gradient(circle at 5% 100%, rgba(169,199,218,.09), transparent 36rem),
      radial-gradient(var(--line) .6px, transparent .8px);
    background-size:auto,auto,16px 16px;
    min-height:100vh;
  }
  main{max-width:1180px;margin:0 auto;padding:30px 22px 60px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
  .kicker{font:11px/1.2 "Cascadia Code",Consolas,monospace;letter-spacing:.24em;color:var(--amber);text-transform:uppercase}
  h1{font:600 30px/1.25 "Yu Mincho","Songti SC",serif;letter-spacing:.1em;margin:7px 0 0}
  h1 span{font:400 14px/1 "Microsoft YaHei",sans-serif;letter-spacing:.05em;color:var(--mute);margin-left:10px}
  .state{display:flex;align-items:center;gap:9px;padding:7px 12px;border:1px solid var(--line);background:rgba(13,21,32,.78);font:12px "Cascadia Code",Consolas,monospace;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mute);box-shadow:0 0 0 0 rgba(232,161,91,0)}
  body[data-phase="rendering"] .dot,body[data-phase="muxing"] .dot{background:var(--amber);animation:pulse 1.4s infinite}
  body[data-phase="complete"] .dot{background:var(--good)} body[data-phase="failed"] .dot,body[data-phase="interrupted"] .dot{background:var(--bad)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,161,91,.5)}70%{box-shadow:0 0 0 8px rgba(232,161,91,0)}100%{box-shadow:0 0 0 0 rgba(232,161,91,0)}}
  .card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(17,25,37,.96),rgba(13,21,32,.92));box-shadow:0 18px 44px rgba(0,0,0,.18);padding:20px}
  .card+.card{margin-top:16px}
  .hero{display:grid;grid-template-columns:190px 1fr;gap:30px;align-items:center}
  .ring{width:176px;height:176px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--amber) 0 0%,#1b2637 0 100%);position:relative;transition:background .25s}
  .ring::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--panel2);border:1px solid rgba(255,255,255,.025)}
  .ring .inner{position:relative;z-index:1;text-align:center}
  .ring b{display:block;font:600 43px/1 "Cascadia Code",Consolas,monospace;letter-spacing:-.05em}
  .ring small{display:block;color:var(--mute);font-size:11px;letter-spacing:.16em;margin-top:8px}
  .statusline{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:12px}
  .statusline strong{font:600 18px/1.35 "Microsoft YaHei",sans-serif;letter-spacing:.02em}
  .tag{font:11px/1 "Cascadia Code",Consolas,monospace;color:var(--mute);border:1px solid var(--line);padding:5px 8px;white-space:nowrap}
  .bar{height:11px;background:#192435;overflow:hidden;border:1px solid rgba(255,255,255,.03)}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--amber));transition:width .45s ease}
  .stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:20px}
  .stat{border-left:1px solid var(--line);padding-left:12px;min-width:0}
  .stat label{display:block;color:var(--mute);font-size:11px;white-space:nowrap}
  .stat b{display:block;margin-top:3px;font:600 15px/1.3 "Cascadia Code",Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pathline{color:var(--mute);font:11px/1.5 "Cascadia Code",Consolas,monospace;margin-top:15px;overflow-wrap:anywhere}
  .download{display:inline-block;margin-top:12px;color:var(--bg);background:var(--amber);padding:8px 14px;text-decoration:none;font-weight:700;font-size:12px}
  .hidden{display:none!important}
  .sectionhead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}
  h2{font:600 15px/1.3 "Microsoft YaHei",sans-serif;letter-spacing:.08em;margin:0}
  h2 small{color:var(--mute);font:400 11px "Cascadia Code",Consolas,monospace;letter-spacing:0;margin-left:8px}
  .hint{color:var(--mute);font-size:11px}
  .alert{border:1px solid rgba(221,107,107,.5);background:rgba(221,107,107,.08);color:#f0b3b3;padding:9px 12px;margin-bottom:12px;font-size:12px}
  .activeGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:14px}
  .activeCard{border:1px solid rgba(232,161,91,.45);background:rgba(232,161,91,.055);padding:11px 12px;position:relative;overflow:hidden}
  .activeCard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber)}
  .activeCard .top{display:flex;justify-content:space-between;gap:10px;font:12px "Cascadia Code",Consolas,monospace;color:var(--amber)}
  .activeCard .meta{font-size:11px;color:var(--sub);margin-top:5px}
  .timeline{display:flex;height:34px;border:1px solid var(--line);background:#0a111b;overflow:hidden}
  .piece{min-width:3px;height:100%;border-right:1px solid rgba(11,16,24,.8);background:#233149;position:relative;transition:background .2s}
  .piece:last-child{border-right:0}
  .piece.reused{background:#1b3144}.piece.done{background:var(--good)}.piece.rendering{background:var(--amber);animation:pulse2 1.3s infinite}.piece.pending{background:#2a3547}
  .piece.rendering::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:sweep 1.4s linear infinite}
  @keyframes pulse2{50%{filter:brightness(1.28)}} @keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:11px;margin-top:10px}
  .legend span{display:flex;align-items:center;gap:6px}.sw{width:10px;height:10px;display:inline-block}
  .sw.good{background:var(--good)}.sw.reuse{background:#1b3144}.sw.active{background:var(--amber)}.sw.pending{background:#2a3547}
  .logwrap{position:relative}
  pre.log{margin:0;height:230px;overflow:auto;background:#080d14;border:1px solid #1e2b3c;padding:13px 14px;color:#aab9ca;font:11.5px/1.55 "Cascadia Code",Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
  .logfoot{display:flex;justify-content:space-between;margin-top:8px;color:var(--mute);font-size:10.5px}
  #offline{margin-bottom:14px}
  @media(max-width:800px){.hero{grid-template-columns:1fr}.ring{margin:0 auto}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}header{align-items:flex-start;flex-direction:column}}
  @media(max-width:460px){main{padding:20px 12px 40px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:24px}.card{padding:15px}}
</style>
</head>
<body data-phase="starting">
<main>
  <header>
    <div>
      <div class="kicker">Koiiro Sora · MV Render Monitor</div>
      <h1>恋色空 <span>全片 720p / 30fps</span></h1>
    </div>
    <div class="state"><span class="dot"></span><span id="phase">正在连接</span></div>
  </header>

  <div id="offline" class="alert hidden">无法连接进度服务，正在自动重试……</div>
  <div id="stalled" class="alert hidden">渲染进程仍在运行，但两个活动分段的临时文件已超过 2 分钟未更新，可能发生卡顿。</div>

  <section class="card hero">
    <div class="ring" id="ring"><div class="inner"><b id="pct">--</b><small>总进度</small></div></div>
    <div>
      <div class="statusline"><strong id="statusText">正在读取渲染计划…</strong><span class="tag" id="processTag">pid —</span></div>
      <div class="bar"><i id="fill"></i></div>
      <div class="stats">
        <div class="stat"><label>已完成片段</label><b id="pieces">—</b></div>
        <div class="stat"><label>本轮渲染</label><b id="rendered">—</b></div>
        <div class="stat"><label>复用片段</label><b id="reused">—</b></div>
        <div class="stat"><label>已用时间</label><b id="elapsed">—</b></div>
        <div class="stat"><label>预计剩余</label><b id="eta">—</b></div>
        <div class="stat"><label>成片大小</label><b id="size">—</b></div>
      </div>
      <div class="pathline" id="pathline">等待渲染服务…</div>
      <a id="download" class="download hidden" href="/output">下载 / 打开成片</a>
    </div>
  </section>

  <section class="card">
    <div class="sectionhead"><h2>当前渲染 <small id="activeCount"></small></h2><span class="hint" id="lastUpdate">—</span></div>
    <div class="activeGrid" id="activeGrid"></div>
    <div class="timeline" id="timeline"></div>
    <div class="legend">
      <span><i class="sw good"></i>本轮已完成</span>
      <span><i class="sw reuse"></i>复用</span>
      <span><i class="sw active"></i>正在渲染</span>
      <span><i class="sw pending"></i>等待</span>
      <span style="margin-left:auto" id="filmRange"></span>
    </div>
  </section>

  <section class="card">
    <div class="sectionhead"><h2>渲染日志 <small>最后 100 行 · 每秒刷新</small></h2><span class="hint" id="logIdle"></span></div>
    <div class="logwrap"><pre class="log" id="log"></pre></div>
    <div class="logfoot"><span>render_film.mjs · 每段缓存复用 · 最终无损拼接 + 混音</span><span id="clock"></span></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const PHASE = {
  starting:['启动中','等待渲染计划'],
  rendering:['渲染中','正在渲染剩余片段'],
  muxing:['拼接混音中','片段已全部完成，正在合成成片'],
  complete:['已完成','成片已输出'],
  failed:['渲染失败','请查看下方日志'],
  interrupted:['已中断','渲染进程已退出，但成片尚未完成'],
  idle:['未启动','尚未发现渲染进程']
};
const fmtDur = (s) => {
  if (s == null || !Number.isFinite(s)) return '—';
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return h ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}:${String(r).padStart(2,'0')}`;
};
const fmtBytes = (b) => {
  if (!b) return '0 B';
  const u = ['B','KB','MB','GB']; let i = 0, n = b;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(i >= 2 ? 1 : 0)} ${u[i]}`;
};
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2,'0')}`;
let planSig = '', logNearBottom = true;
$('log').addEventListener('scroll', () => {
  const el = $('log'); logNearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 45;
});

function render(s) {
  document.body.dataset.phase = s.phase;
  const [phaseLabel, statusText] = PHASE[s.phase] || [s.phase, s.phase];
  $('phase').textContent = phaseLabel;
  $('statusText').textContent = statusText;
  $('processTag').textContent = s.processAlive ? `pid ${s.pid} · live` : (s.pid ? `pid ${s.pid} · stopped` : 'pid —');
  $('pct').textContent = `${s.percent.toFixed(1)}%`;
  $('ring').style.background = `conic-gradient(var(--amber) 0 ${s.percent}%, #1b2637 ${s.percent}% 100%)`;
  $('fill').style.width = `${s.percent}%`;
  $('pieces').textContent = `${s.completePieces} / ${s.expectedPieces}`;
  $('rendered').textContent = `${s.renderedDone} / ${s.renderPieces}`;
  $('reused').textContent = `${s.reusedPieces}`;
  $('elapsed').textContent = fmtDur(s.elapsedSeconds);
  $('eta').textContent = s.phase === 'complete' ? '完成' : fmtDur(s.etaSeconds);
  $('size').textContent = s.output.exists ? fmtBytes(s.output.bytes) : '—';
  $('pathline').textContent = `${s.outputRel} · 已完成片段 ${s.doneFilmSeconds.toFixed(1)}s / 本轮 ${s.renderFilmSeconds.toFixed(1)}s · 进程${s.processAlive ? '运行中' : '已停止'}`;
  $('download').classList.toggle('hidden', !s.output.exists || s.phase !== 'complete');
  $('stalled').classList.toggle('hidden', !s.stalled);
  $('activeCount').textContent = s.active.length ? `${s.active.length} 个并行任务` : '当前无活动任务';
  $('lastUpdate').textContent = `更新于 ${new Date(s.now).toLocaleTimeString('zh-CN',{hour12:false})}`;
  $('filmRange').textContent = s.plan.length ? `${mmss(s.plan[0].from)} — ${mmss(s.plan[s.plan.length-1].to)}` : '';
  $('logIdle').textContent = s.logIdleSeconds == null ? '' : `日志静默 ${fmtDur(s.logIdleSeconds)}`;
  $('clock').textContent = new Date(s.now).toLocaleString('zh-CN',{hour12:false});

  $('activeGrid').innerHTML = s.active.length ? s.active.map(a => `
    <div class="activeCard">
      <div class="top"><span>${a.section || 'segment'}</span><span>${mmss(a.from)}–${mmss(a.to)}</span></div>
      <div class="meta">临时文件 ${fmtBytes(a.bytes)} · ${a.ageSeconds < 2 ? '刚刚更新' : `${fmtDur(a.ageSeconds)} 前更新`}</div>
      <div class="meta">${a.name}</div>
    </div>`).join('') : '<div class="hint" style="padding:8px 0">等待渲染器启动或正在拼接…</div>';

  const sig = s.plan.map(p => `${p.from}-${p.to}-${p.kind}-${p.status}`).join('|');
  if (sig !== planSig) {
    planSig = sig;
    $('timeline').innerHTML = s.plan.map(p => {
      const dur = Math.max(.1, p.to - p.from);
      const cls = p.status === 'done' ? 'done' : p.status === 'reused' ? 'reused' : p.status === 'rendering' ? 'rendering' : 'pending';
      return `<div class="piece ${cls}" style="flex:${dur} 1 0%" title="${p.section} · ${mmss(p.from)}–${mmss(p.to)} · ${p.status}"></div>`;
    }).join('');
  }

  const log = s.logTail.join('\n');
  if ($('log').textContent !== log) {
    $('log').textContent = log || '等待日志…';
    if (logNearBottom) $('log').scrollTop = $('log').scrollHeight;
  }
  $('offline').classList.add('hidden');
}

async function tick() {
  try {
    const r = await fetch(`/api/status?t=${Date.now()}`, {cache:'no-store'});
    if (!r.ok) throw new Error(String(r.status));
    render(await r.json());
  } catch (e) {
    $('offline').classList.remove('hidden');
    $('phase').textContent = '连接中断';
    document.body.dataset.phase = 'interrupted';
  }
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
